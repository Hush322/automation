services:
  currency-cron:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: currency-cron

    restart: unless-stopped

    environment:
      TZ: Europe/Chisinau
      API_URL: http://host.docker.internal:8080/

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./data:/data
      - ./logs:/var/log

    init: true
